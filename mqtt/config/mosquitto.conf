# Lab04 MQTT broker (separate instance from the Lab3 broker, which stays on 1883)
# Container listens on 1883 internally; docker-compose maps host 1884 -> container 1883.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
